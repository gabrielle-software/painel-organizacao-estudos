name: Verificação de qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    name: Validar JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe do JavaScript
        run: node --check script.js
      - name: Verificar arquivos essenciais
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s README.md
